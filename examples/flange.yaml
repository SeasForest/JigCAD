part: flange
process: cnc
material: aluminium
params:
  D: 80
  T: 10
  bore: 22
  bolt_circle: 60
  n_bolts: 6
features:
  - id: disc
    use: cylinder
    with: {d: =D, h: =T}
  - id: hub
    use: boss
    on: disc.top
    with: {d: 36, h: 8}
  - id: center_bore
    use: hole
    on: hub.tip
    with: {d: =bore}
  - id: bolts
    use: hole
    on: disc.top
    repeat: {polar: {n: =n_bolts, r: "=bolt_circle/2", start: 0}}
    with: {size: M6, type: cbore}
  - id: break_edges
    use: chamfer
    with: {d: 0.5, edges: circular, of: disc}
checks:
  bbox: {size: [=D, =D, "=T + 8"], tol: 0.01}
  com: {expect: [0, 0, null], tol: 0.01}
  dims:
    - {name: bolt_circle, value: "=dist(bolts.points[0], bolts.points[3])", expect: =bolt_circle, tol: 0.005}
