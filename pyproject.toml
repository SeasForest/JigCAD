[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jigcad"
version = "0.1.0"
description = "Agent-first parametric B-Rep CAD toolchain: declarative feature specs, component library, local self-checks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "build123d>=0.9",
  "pyyaml>=6",
  "numpy>=1.24",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jig = "jigcad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
